name: CCAs Bench

on:
  push:
    branches: ["codex/mahimahi-*"]
    paths:
      - .github/workflows/mahimahi-compare.yml
      - scripts/**
      - kernel/tcp_copa_auto/**
      - kernel/tcp_leocc/**
  workflow_dispatch:
    inputs:
      mode:
        description: "Quick checks LTE; rct checks LTE app.wk; rct-datasets runs all 4 RCT workloads across LTE/NYC/Lumos5G/LeoCC; lumos-*-all runs full Lumos5G sets."
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - rct
          - rct-datasets
          - smoke
          - full
          - nyc-subway
          - lumos-5g
          - lumos-5g-all
          - lumos-4g-all
          - lumos-all
          - leo
          - datasets
      theta:
        description: "Theta in [0.01, 0.99] (or comma-separated list for rct-datasets, e.g. 0.9,0.98)"
        required: true
        default: "0.9"
        type: string
      repeats:
        description: "Number of time-shifted repeats per configuration (default 1)"
        required: true
        default: "1"
        type: string
      parallel:
        description: "Optional max concurrent runs per runner (empty = auto-scaled from CPU count)"
        required: false
        default: ""
        type: string
      queues:
        description: "Optional queue sizes override, e.g. 150KB,2MB or 2MB (empty = dataset-specific shallow/deep queues)"
        required: false
        default: ""
        type: string
      rct_workloads:
        description: "Comma-separated workloads for rct-datasets (app,websearch,vl2,pageload)"
        required: false
        default: "app,websearch,vl2,pageload"
        type: string
      quinn_ccs:
        description: "Optional quinn CCs override (empty = mode default; e.g. copa-auto,copa-auto-theta0.98,copa-auto-nc,copa,copa-nc,bbr1,bbr2,bbr3,cubic,new-reno)"
        required: false
        default: ""
        type: string
      kernel_ccs:
        description: "Optional Kernel TCP CCs override (empty = mode default; e.g. copa_auto,copa_auto_theta0.98,copa_auto_nc,copa_orig,mortise_copa,leocc,bbr,cubic,vegas,cdg,veno,yeah,illinois,westwood,hybla,reno)"
        required: false
        default: ""
        type: string
      run_quinn:
        description: "Also build and run quinn-perf (QUIC) from quinn_repo; leave false for pure Linux Kernel TCP comparison"
        required: true
        default: false
        type: boolean
      quinn_repo:
        description: "GitHub repository for optional quinn-perf build (only used when run_quinn=true)"
        required: false
        default: "jimmyhuang454/quinn-jls"
        type: string
      quinn_ref:
        description: "Git branch/tag/SHA of quinn_repo (only used when run_quinn=true)"
        required: false
        default: "jls-main"
        type: string
      run_kernel:
        description: "Build and run Linux Kernel TCP stack (tcp_copa_auto.ko + tcp_leocc.ko + BobAnkh/Mortise + kernel CCs)"
        required: true
        default: true
        type: boolean
      send_fairness:
        description: "quinn TransportConfig::send_fairness (false = FIFO across concurrent streams like single-TCP)"
        required: true
        default: false
        type: boolean
      stream_receive_window:
        description: "quinn --stream-receive-window (e.g. 8M avoids 1.25M flow-control interleaving on app.wk)"
        required: false
        default: "8M"
        type: string

concurrency:
  group: mahimahi-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.matrix.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        env:
          MODE: ${{ inputs.mode || (github.ref_name == 'codex/mahimahi-rct' && 'rct') || 'datasets' }}
          RCT_WORKLOADS: ${{ inputs.rct_workloads || 'app,websearch,vl2,pageload' }}
        run: python3 scripts/ci_runner.py plan

  quinn-eval:
    name: quinn (${{ matrix.shard }}, ${{ matrix.workload }})
    needs: plan
    if: ${{ inputs.run_quinn == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout copa-auto-bench
        uses: actions/checkout@v4

      - name: Checkout quinn-jls (for quinn-perf)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.quinn_repo }}
          ref: ${{ inputs.quinn_ref }}
          path: quinn-jls

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: quinn-jls

      - name: Install Mahimahi & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autotools-dev autoconf libtool libssl-dev xcb \
            libxcb-composite0-dev libxcb-present-dev libcairo2-dev \
            libpango1.0-dev dnsmasq iproute2 python3 curl
          bash scripts/install_mahimahi.sh "${{ matrix.shard }}"

      - name: Build quinn-perf
        working-directory: quinn-jls
        run: cargo build --release -p perf

      - name: Run quinn-perf Mahimahi suite (${{ matrix.shard }})
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          THETA: ${{ inputs.theta || '0.98' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          PARALLEL: ${{ inputs.parallel || '' }}
          QUEUES: ${{ inputs.queues || '' }}
          QUINN_CCS: ${{ inputs.quinn_ccs || '' }}
          SHARD: ${{ matrix.shard }}
          WORKLOAD: ${{ matrix.workload }}
          SEND_FAIRNESS: ${{ inputs.send_fairness && 'true' || 'false' }}
          STREAM_RECEIVE_WINDOW: ${{ inputs.stream_receive_window || '8M' }}
        run: python3 scripts/ci_runner.py run-quinn --bin ./quinn-jls/target/release/quinn-perf --out-dir /tmp/quinn_out

      - name: Upload quinn-jls shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-quinn-${{ matrix.shard }}-${{ matrix.workload }}
          path: /tmp/quinn_out

  kernel-eval:
    name: kernel (${{ matrix.shard }}, ${{ matrix.workload }})
    needs: plan
    if: ${{ github.event_name == 'push' || inputs.run_kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout copa-auto-bench
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone BobAnkh/Mortise
        run: git clone --depth 1 https://github.com/BobAnkh/Mortise.git /tmp/Mortise

      - name: Install Mahimahi, kernel headers, eBPF toolchain, and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autotools-dev autoconf libtool libssl-dev xcb \
            libxcb-composite0-dev libxcb-present-dev libcairo2-dev \
            libpango1.0-dev dnsmasq iproute2 \
            clang llvm libbpf-dev libelf-dev dwarves pkg-config \
            build-essential python3-pip python3-venv curl \
            "linux-headers-$(uname -r)" \
            linux-tools-common "linux-tools-$(uname -r)" || \
            sudo apt-get install -y -qq linux-headers-generic linux-tools-generic || true

          if ! command -v bpftool >/dev/null 2>&1; then
            BPFTOOL_BIN=$(find /usr/lib/linux-tools* /usr/sbin /usr/bin -name bpftool -type f 2>/dev/null | head -n1 || true)
            [ -n "$BPFTOOL_BIN" ] && sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool
          fi
          bpftool version || true

          bash scripts/install_mahimahi.sh "${{ matrix.shard }}"

          sudo mkdir -p /home/vagrant
          sudo chown "$(id -u):$(id -g)" /home/vagrant
          python3 -m venv /home/vagrant/mortise-venv
          /home/vagrant/mortise-venv/bin/pip install -q numpy structlog scipy pandas
          ln -sfn /tmp/Mortise/algorithm /home/vagrant/algorithm

      - name: Build & load custom kernel TCP modules (tcp_copa_auto, tcp_leocc)
        run: |
          make -C kernel/tcp_copa_auto test
          make -C kernel/tcp_copa_auto
          sudo insmod kernel/tcp_copa_auto/tcp_copa_auto.ko
          if make -C kernel/tcp_leocc; then
            sudo insmod kernel/tcp_leocc/tcp_leocc.ko min_rtt_fluctuation=10000 offset=12000 || true
          else
            echo "WARN: tcp_leocc skipped on kernel $(uname -r)"
          fi
          for mod in tcp_bbr tcp_vegas tcp_cdg tcp_veno tcp_yeah tcp_illinois tcp_westwood tcp_hybla; do
            sudo modprobe "$mod" || true
          done
          sudo sysctl -w net.core.default_qdisc=fq || true
          AVAIL_CCS="$(sysctl -n net.ipv4.tcp_available_congestion_control 2>/dev/null || echo 'cubic reno bbr')"
          sudo sysctl -w net.ipv4.tcp_allowed_congestion_control="$AVAIL_CCS" || true
          echo "Available kernel CCs: $AVAIL_CCS"

      - name: Patch & build Mortise BPF object and Rust binaries
        run: |
          uname -r
          rm -f /tmp/Mortise/algorithm/bpf-kern/include/vmlinux.h
          make -C /tmp/Mortise/algorithm/bpf-kern vmlinux
          python3 scripts/ci_runner.py patch-mortise --mortise-dir /tmp/Mortise
          make -C /tmp/Mortise/algorithm/bpf-kern build/mortise_copa.bpf.o
          cargo build --release --manifest-path /tmp/Mortise/mortise/Cargo.toml -p mortise-manager -p traffic
          if make -C /tmp/Mortise/algorithm/kern-mod && sudo make -C /tmp/Mortise/algorithm/kern-mod install; then
            echo "COPA_KMOD=1" >> "$GITHUB_ENV"
          else
            echo "WARN: kern-mod copa skipped on kernel $(uname -r)"
            echo "COPA_KMOD=0" >> "$GITHUB_ENV"
          fi

      - name: Run Kernel TCP Mahimahi suite (${{ matrix.shard }})
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          THETA: ${{ inputs.theta || '0.98' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          PARALLEL: ${{ inputs.parallel || '' }}
          QUEUES: ${{ inputs.queues || '' }}
          KERNEL_CCS: ${{ inputs.kernel_ccs || '' }}
          SHARD: ${{ matrix.shard }}
          WORKLOAD: ${{ matrix.workload }}
        run: python3 scripts/ci_runner.py run-kernel --mortise-dir /tmp/Mortise --out-dir /tmp/kernel_out

      - name: Upload Kernel TCP shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-kernel-${{ matrix.shard }}-${{ matrix.workload }}
          path: /tmp/kernel_out

  summarize:
    name: Unified Comparison Summary
    needs: [plan, quinn-eval, kernel-eval]
    if: ${{ !cancelled() && (needs.quinn-eval.result != 'skipped' || needs.kernel-eval.result != 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: /tmp/all_results

      - name: Analyze and write summary
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: python3 scripts/ci_runner.py summarize --input-dir /tmp/all_results --out-dir /tmp/summary

      - name: Upload unified comparison summary
        uses: actions/upload-artifact@v4
        with:
          name: comparison-summary
          path: /tmp/summary
